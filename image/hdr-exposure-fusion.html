<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>HDR 曝光融合工具</title>
  <style>
    :root{color-scheme:dark;--bg:#080d19;--panel:#141c2e;--line:#2c3854;--text:#f1f5ff;--muted:#aab6d1;--accent:#53d7ff;--warm:#ffb454}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--text);background:linear-gradient(145deg,#080c17,#121c34)}
    header{padding:22px max(18px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);background:#090e1bcc}h1{margin:0 0 5px;font-size:clamp(23px,4vw,33px)}p{margin:0;color:var(--muted)}
    main{width:min(1200px,100%);margin:auto;padding:18px;display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 16px 42px #0006}.controls{align-self:start;display:grid;gap:15px}.section{display:grid;gap:9px}.section+.section{border-top:1px solid var(--line);padding-top:15px}.title{font-weight:750}.note,.status{font-size:13px;color:var(--muted)}
    label.file{display:grid;gap:5px;color:var(--muted)}input[type=file]{width:100%;color:var(--muted)}input[type=file]::file-selector-button,button{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#202a44;color:var(--text);font-weight:680;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#087ea4;border-color:#38c8ef}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.mode button.active{outline:2px solid var(--accent);background:#16485e}
    .range{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;color:var(--muted)}.range input{grid-column:1/-1;width:100%}output{color:var(--text);font-variant-numeric:tabular-nums}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
    .stage-panel{min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stage{position:relative;min-height:440px;display:grid;place-items:center;overflow:auto;border-radius:12px;background-color:#070a11;background-image:linear-gradient(45deg,#171d2a 25%,transparent 25%),linear-gradient(-45deg,#171d2a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#171d2a 75%),linear-gradient(-45deg,transparent 75%,#171d2a 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;touch-action:none}canvas{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;cursor:crosshair}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);pointer-events:none}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:13px;color:var(--muted)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.orange{background:#ff7b31}.blue{background:#33aaff}
    @media(max-width:820px){main{grid-template-columns:1fr}.stage{min-height:340px}}
  </style>
</head>
<body>
  <header><h1>HDR 曝光融合</h1><p>合併一張保留天空的暗曝光照與一張保留人物的亮曝光照。照片只在瀏覽器本機處理。</p></header>
  <main>
    <aside class="panel controls">
      <section class="section"><div class="title">1. 載入照片</div>
        <label class="file">暗曝光照（天空／夕陽正常）<input id="darkFile" type="file" accept="image/*"></label>
        <label class="file">亮曝光照（人物／陰影正常）<input id="brightFile" type="file" accept="image/*"></label>
        <div class="note">兩張照片應使用相同焦點、焦段與白平衡；亮曝光照會作為防鬼影基準。</div>
      </section>
      <section class="section"><div class="title">2. 對齊照片</div>
        <button id="autoAlign" type="button" disabled>自動對齊暗曝光照</button>
        <label class="range"><span>水平位移</span><output id="xOut">0</output><input id="offsetX" type="range" min="-120" max="120" value="0"></label>
        <label class="range"><span>垂直位移</span><output id="yOut">0</output><input id="offsetY" type="range" min="-120" max="120" value="0"></label>
        <label class="range"><span>暗曝光縮放</span><output id="scaleOut">100%</output><input id="darkScale" type="range" min="96" max="104" step="0.1" value="100"></label>
      </section>
      <section class="section"><div class="title">3. 自動融合</div>
        <label class="range"><span>融合柔和度</span><output id="softOut">24</output><input id="softness" type="range" min="8" max="60" value="24"></label>
        <label class="range"><span>亮曝光偏好</span><output id="biasOut">50%</output><input id="brightBias" type="range" min="20" max="80" value="50"></label>
        <label class="check"><input id="deghost" type="checkbox" checked><span>防鬼影：在差異很大的細節區域優先保留亮曝光基準照</span></label>
        <label class="range"><span>防鬼影強度</span><output id="ghostOut">45</output><input id="ghostStrength" type="range" min="0" max="100" value="45"></label>
      </section>
      <section class="section"><div class="title">4. 手動修正</div>
        <div class="row mode"><button id="autoBrush" class="active" type="button">恢復自動</button><button id="brightBrush" type="button">指定亮照</button><button id="darkBrush" type="button">指定暗照</button></div>
        <label class="range"><span>筆刷大小</span><output id="brushOut">80</output><input id="brush" type="range" min="8" max="320" value="80"></label>
        <div class="row"><button id="undo" type="button">復原</button><button id="clearMask" type="button">清除修正</button></div>
      </section>
      <section class="section"><div class="title">5. 匯出</div><button id="download" class="primary" type="button" disabled>下載融合 PNG</button><div class="note">輸出為一般 SDR PNG；效果屬於曝光融合，不是 HDR10 gain map。</div></section>
    </aside>
    <section class="panel stage-panel">
      <div class="toolbar"><div class="row mode" id="views"><button data-view="result" class="active">融合結果</button><button data-view="compare">交錯比較</button><button data-view="mask">修正遮罩</button></div><span id="status" class="status">等待照片</span></div>
      <div class="stage"><canvas id="display"></canvas><div id="empty" class="empty">請先載入暗曝光照與亮曝光照</div></div>
      <div class="legend"><span><i class="dot orange"></i>橘色：強制使用亮曝光</span><span><i class="dot blue"></i>藍色：強制使用暗曝光</span></div>
    </section>
  </main>
<script>
(()=>{'use strict';
  const $=id=>document.getElementById(id), display=$('display'),ctx=display.getContext('2d',{willReadFrequently:true});
  const darkC=document.createElement('canvas'),brightC=document.createElement('canvas'),overrideC=document.createElement('canvas');
  const dc=darkC.getContext('2d',{willReadFrequently:true}),bc=brightC.getContext('2d',{willReadFrequently:true}),oc=overrideC.getContext('2d',{willReadFrequently:true});
  let darkImg=null,brightImg=null,view='result',brushMode='auto',drawing=false,last=null,history=[],renderTimer=0; const MAX=1500;
  function load(file){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(Error('無法讀取照片'));i.src=u})}
  async function choose(kind,file){if(!file)return;try{const i=await load(file);if(kind==='dark')darkImg=i;else brightImg=i;setup()}catch(e){alert(e.message)}}
  function setup(){if(!darkImg||!brightImg)return;const s=Math.min(1,MAX/Math.max(brightImg.naturalWidth,brightImg.naturalHeight)),w=Math.round(brightImg.naturalWidth*s),h=Math.round(brightImg.naturalHeight*s);[display,darkC,brightC,overrideC].forEach(c=>{c.width=w;c.height=h});bc.drawImage(brightImg,0,0,w,h);oc.clearRect(0,0,w,h);history=[];$('empty').hidden=true;$('download').disabled=false;$('autoAlign').disabled=false;$('status').textContent=`預覽 ${w} × ${h}｜輸出 ${brightImg.naturalWidth} × ${brightImg.naturalHeight}`;schedule()}
  function drawDark(target,w,h,ratio=1){const c=target.getContext?target.getContext('2d'):target,s=+$('darkScale').value/100,dx=+$('offsetX').value*ratio,dy=+$('offsetY').value*ratio,sw=w*s,sh=h*s;c.clearRect(0,0,w,h);c.drawImage(darkImg,(w-sw)/2+dx,(h-sh)/2+dy,sw,sh)}
  const lum=(r,g,b)=>(.2126*r+.7152*g+.0722*b)/255;
  function blurWeights(a,w,h,r){if(r<1)return a;const tmp=new Float32Array(a.length),out=new Float32Array(a.length),rad=Math.max(1,Math.round(r));for(let y=0;y<h;y++){let sum=0;for(let x=-rad;x<=rad;x++)sum+=a[y*w+Math.max(0,Math.min(w-1,x))];for(let x=0;x<w;x++){tmp[y*w+x]=sum/(rad*2+1);sum+=a[y*w+Math.min(w-1,x+rad+1)]-a[y*w+Math.max(0,x-rad)]}}for(let x=0;x<w;x++){let sum=0;for(let y=-rad;y<=rad;y++)sum+=tmp[Math.max(0,Math.min(h-1,y))*w+x];for(let y=0;y<h;y++){out[y*w+x]=sum/(rad*2+1);sum+=tmp[Math.min(h-1,y+rad+1)*w+x]-tmp[Math.max(0,y-rad)*w+x]}}return out}
  function fuseTo(target,w,h,high=false){const t=target.getContext('2d',{willReadFrequently:true}),d=document.createElement('canvas'),b=document.createElement('canvas');d.width=b.width=w;d.height=b.height=h;drawDark(d,w,h,w/display.width);b.getContext('2d').drawImage(brightImg,0,0,w,h);const di=d.getContext('2d').getImageData(0,0,w,h),bi=b.getContext('2d').getImageData(0,0,w,h),out=t.createImageData(w,h),weights=new Float32Array(w*h),bias=+$('brightBias').value/100,sigma=.23;
    for(let i=0,p=0;i<di.data.length;i+=4,p++){const ld=lum(di.data[i],di.data[i+1],di.data[i+2]),lb=lum(bi.data[i],bi.data[i+1],bi.data[i+2]),wd=Math.exp(-((ld-.5)**2)/(2*sigma*sigma)),wb=Math.exp(-((lb-.5)**2)/(2*sigma*sigma));weights[p]=(wb*bias)/(wb*bias+wd*(1-bias)+1e-6)}
    const soft=+$('softness').value*(w/display.width)/5,W=blurWeights(weights,w,h,soft),ov=document.createElement('canvas');ov.width=w;ov.height=h;ov.getContext('2d').drawImage(overrideC,0,0,w,h);const oi=ov.getContext('2d').getImageData(0,0,w,h),ghost=+$('ghostStrength').value/100;
    for(let i=0,p=0;i<out.data.length;i+=4,p++){let wb=W[p];const or=oi.data[i],ob=oi.data[i+2],oa=oi.data[i+3]/255;if(oa>.02)wb=or>ob?oa:1-oa;else if($('deghost').checked&&ghost>0){const x=p%w,y=(p/w)|0;if(x>0&&y>0&&x<w-1&&y<h-1){const gd=Math.abs(lum(di.data[i-4],di.data[i-3],di.data[i-2])-lum(di.data[i+4],di.data[i+5],di.data[i+6]))+Math.abs(lum(di.data[i-w*4],di.data[i-w*4+1],di.data[i-w*4+2])-lum(di.data[i+w*4],di.data[i+w*4+1],di.data[i+w*4+2]));const gb=Math.abs(lum(bi.data[i-4],bi.data[i-3],bi.data[i-2])-lum(bi.data[i+4],bi.data[i+5],bi.data[i+6]))+Math.abs(lum(bi.data[i-w*4],bi.data[i-w*4+1],bi.data[i-w*4+2])-lum(bi.data[i+w*4],bi.data[i+w*4+1],bi.data[i+w*4+2]));if(Math.abs(gd-gb)>.18*(1-ghost*.8))wb=Math.max(wb,.82)}}for(let k=0;k<3;k++)out.data[i+k]=Math.round(bi.data[i+k]*wb+di.data[i+k]*(1-wb));out.data[i+3]=255}t.putImageData(out,0,0)}
  function schedule(){clearTimeout(renderTimer);renderTimer=setTimeout(render,30)}
  function render(){if(!darkImg||!brightImg)return;drawDark(dc,display.width,display.height);if(view==='result')fuseTo(display,display.width,display.height);else if(view==='compare'){ctx.clearRect(0,0,display.width,display.height);const z=48;for(let y=0;y<display.height;y+=z)for(let x=0;x<display.width;x+=z)ctx.drawImage(((x/z+y/z)&1)?brightC:darkC,x,y,z,z,x,y,z,z)}else{fuseTo(display,display.width,display.height);ctx.save();ctx.globalAlpha=.55;ctx.drawImage(overrideC,0,0);ctx.restore()}}
  function point(e){const r=display.getBoundingClientRect();return{x:(e.clientX-r.left)*display.width/r.width,y:(e.clientY-r.top)*display.height/r.height}}
  function snap(){if(history.length>=12)history.shift();history.push(oc.getImageData(0,0,overrideC.width,overrideC.height))}
  function stroke(a,b){oc.save();oc.lineCap='round';oc.lineJoin='round';oc.lineWidth=+$('brush').value;if(brushMode==='auto'){oc.globalCompositeOperation='destination-out';oc.strokeStyle='#000'}else{oc.globalCompositeOperation='source-over';oc.strokeStyle=brushMode==='bright'?'#ff5a00':'#008cff'}oc.beginPath();oc.moveTo(a.x,a.y);oc.lineTo(b.x,b.y);oc.stroke();oc.restore();schedule()}
  display.onpointerdown=e=>{if(!darkImg||view==='compare')return;e.preventDefault();display.setPointerCapture(e.pointerId);snap();drawing=true;last=point(e);stroke(last,last)};display.onpointermove=e=>{if(!drawing)return;const p=point(e);stroke(last,p);last=p};display.onpointerup=display.onpointercancel=()=>{drawing=false;last=null};
  function normGray(canvas,size=220){const c=document.createElement('canvas'),ratio=canvas.height/canvas.width;c.width=size;c.height=Math.round(size*ratio);const x=c.getContext('2d');x.drawImage(canvas,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data,a=new Float32Array(c.width*c.height);let mean=0;for(let i=0,p=0;i<d.length;i+=4,p++){a[p]=lum(d[i],d[i+1],d[i+2]);mean+=a[p]}mean/=a.length;let sd=0;for(const v of a)sd+=(v-mean)**2;sd=Math.sqrt(sd/a.length)||1;for(let i=0;i<a.length;i++)a[i]=(a[i]-mean)/sd;return{a,w:c.width,h:c.height}}
  function align(){const A=normGray(brightC),D=normGray(darkC),range=14,step=2;let best=1e99,bx=0,by=0;for(let dy=-range;dy<=range;dy++)for(let dx=-range;dx<=range;dx++){let score=0,n=0;for(let y=range;y<A.h-range;y+=step)for(let x=range;x<A.w-range;x+=step){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=D.w||yy>=D.h)continue;score+=Math.abs(A.a[y*A.w+x]-D.a[yy*D.w+xx]);n++}score/=n;if(score<best){best=score;bx=dx;by=dy}}$('offsetX').value=Math.max(-120,Math.min(120,-bx*display.width/A.w));$('offsetY').value=Math.max(-120,Math.min(120,-by*display.height/A.h));$('xOut').value=Math.round($('offsetX').value);$('yOut').value=Math.round($('offsetY').value);$('status').textContent=`自動對齊完成：X ${$('xOut').value}、Y ${$('yOut').value}`;schedule()}
  $('darkFile').onchange=e=>choose('dark',e.target.files[0]);$('brightFile').onchange=e=>choose('bright',e.target.files[0]);$('autoAlign').onclick=align;
  function setBrush(m){brushMode=m;[['autoBrush','auto'],['brightBrush','bright'],['darkBrush','dark']].forEach(([id,v])=>$(id).classList.toggle('active',m===v));view='mask';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='mask'));schedule()}
  $('autoBrush').onclick=()=>setBrush('auto');$('brightBrush').onclick=()=>setBrush('bright');$('darkBrush').onclick=()=>setBrush('dark');$('undo').onclick=()=>{const s=history.pop();if(s){oc.putImageData(s,0,0);schedule()}};$('clearMask').onclick=()=>{if(!darkImg)return;snap();oc.clearRect(0,0,overrideC.width,overrideC.height);schedule()};
  $('views').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));schedule()};
  [['offsetX','xOut',v=>Math.round(v)],['offsetY','yOut',v=>Math.round(v)],['darkScale','scaleOut',v=>v+'%'],['softness','softOut',v=>v],['brightBias','biasOut',v=>v+'%'],['ghostStrength','ghostOut',v=>v],['brush','brushOut',v=>v]].forEach(([id,out,fmt])=>$(id).oninput=()=>{$(out).value=fmt($(id).value);schedule()});$('deghost').onchange=schedule;
  $('download').onclick=()=>{if(!darkImg||!brightImg)return;$('status').textContent='正在產生原始尺寸圖片…';requestAnimationFrame(()=>{const o=document.createElement('canvas');o.width=brightImg.naturalWidth;o.height=brightImg.naturalHeight;fuseTo(o,o.width,o.height,true);o.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hdr-exposure-fusion.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent=`完成｜${o.width} × ${o.height}`},'image/png')})};
})();
</script></body></html>
